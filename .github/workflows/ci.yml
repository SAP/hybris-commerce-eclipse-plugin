name: Build
on: [pull_request]

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: "Setup Java JDK"
      uses: "actions/setup-java@v6"
      with:
        distribution: "sapmachine"
        java-version: "21"
        cache: maven
    - name: MVN build
      run: ./mvnw --batch-mode --update-snapshots package
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

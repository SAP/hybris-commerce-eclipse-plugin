name: Documentation and Eclipse update site

on:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/docs/**'
      - 'updatesite/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/docs/**'
      - 'updatesite/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional vX.Y.Z tag to archive; blank updates Development only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && 'master' || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r tools/docs/requirements.txt
      - name: Test homepage and published resources
        run: python -m unittest discover -s tools/docs -p 'test_*.py'
      - name: Build documentation and validate Eclipse update site
        run: python -m mkdocs build --strict
      - name: Assemble versioned documentation and canonical Eclipse update site
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python tools/docs/versioned_site.py --release-tag "$RELEASE_TAG" --export-history
      - name: Transfer generated documentation history to deployment job
        if: (github.ref == 'refs/heads/master' && github.event_name != 'pull_request') || github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: docs-history
          path: docs-history.bundle
          if-no-files-found: error
          retention-days: 1
      - name: Configure Pages
        if: (github.ref == 'refs/heads/master' && github.event_name != 'pull_request') || github.event_name == 'release'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: (github.ref == 'refs/heads/master' && github.event_name != 'pull_request') || github.event_name == 'release'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: (github.ref == 'refs/heads/master' && github.event_name != 'pull_request') || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: docs-history
          path: ${{ runner.temp }}/docs-history
      - name: Persist generated version archives without changing source branches
        run: |
          git fetch "$RUNNER_TEMP/docs-history/docs-history.bundle" docs-versions:refs/heads/docs-versions
          git push origin refs/heads/docs-versions:refs/heads/docs-versions
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

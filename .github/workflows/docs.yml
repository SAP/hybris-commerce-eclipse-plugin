name: Documentation and Eclipse update site

on:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/docs/**'
      - 'updatesite/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/docs/**'
      - 'updatesite/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r tools/docs/requirements.txt
      - name: Test homepage and published resources
        run: python -m unittest discover -s tools/docs -p 'test_*.py'
      - name: Build documentation and validate Eclipse update site
        run: python -m mkdocs build --strict
      - name: Configure Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

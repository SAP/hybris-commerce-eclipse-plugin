site_name: Eclipse Plugin for SAP Commerce
site_description: User and developer documentation for the SAP Commerce Eclipse plugin.
site_url: https://sap.github.io/hybris-commerce-eclipse-plugin/
repo_url: https://github.com/SAP/hybris-commerce-eclipse-plugin
repo_name: SAP/hybris-commerce-eclipse-plugin
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.code.copy
    - search.highlight

plugins:
  - search

hooks:
  - tools/docs/hooks.py

watch:
  - README.md
  - tools/docs
  - updatesite

exclude_docs: |
  docker-compose.yml
  start-sonar.sh
  dev/eclipse-code-style.xml
  internal/*.*

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - User guide:
      - Installation and update site: installation.md
      - Project importer: importer/importer.md
      - Beans generation: beangen/beangen.md
      - JDK selection: import-jdk.md
  - Troubleshooting:
      - Knowledge database: kb/info.md
  - Developer guide:
      - Development and releases: dev/development.md
      - Documentation and plugin versioning: dev/versioning.md
      - ImpEx:
          - Language behavior: dev/impex/impex-docs.md
          - Editor migration plan: dev/impex/editor-replacement-plan.md
      - Regression verification: dev/import-and-junit-verification.md
  - Project information:
      - Deprecations: deprecation/deprecation.md
      - Contributing: https://github.com/SAP/hybris-commerce-eclipse-plugin/blob/master/CONTRIBUTING.md
      - Code of conduct: https://github.com/SAP/hybris-commerce-eclipse-plugin/blob/master/CODE_OF_CONDUCT.md
      - License: https://github.com/SAP/hybris-commerce-eclipse-plugin/blob/master/LICENSE
